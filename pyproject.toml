[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "argjacent"
version = "0.5.1"
description = "Certified genomic contexts of genes (e.g. antibiotic resistance genes) from paired short reads of a metagenome, without assembly"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Amulya Baral"}]
requires-python = ">=3.8"
dependencies = ["numpy>=1.20"]
keywords = ["metagenomics", "antibiotic resistance", "genomic context", "minimizers", "targeted assembly", "mobile genetic elements"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/amulyabaral/argjacent"
Repository = "https://github.com/amulyabaral/argjacent"
Issues = "https://github.com/amulyabaral/argjacent/issues"

[project.scripts]
argjacent = "argjacent.cli:main"
argjacent-cohort = "argjacent.cohort:main"
argjacent-selftest = "argjacent.selftest:main"

[tool.setuptools]
packages = ["argjacent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
