name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc zlib1g-dev
      - name: Install package and pytest
        run: |
          python -m pip install -U pip setuptools pytest
          python -m pip install .
      - name: Strict C warning check
        run: |
          cc -O2 -Wall -Wextra -Wshadow -Wno-unused-parameter -o /tmp/aw_chk src/aw.c -lz -lpthread -lm
          cc -O2 -Wall -Wextra -Wshadow -Wno-unused-parameter -o /tmp/awx_chk src/awx.c -lpthread
          cc -O2 -Wall -Wextra -Wshadow -Wno-unused-parameter -o /tmp/awv_chk src/awv.c -lpthread
          /tmp/aw_chk -v
          /tmp/awx_chk -v
          /tmp/awv_chk -v
      - name: CLI smoke & self-test
        run: |
          argjacent --version
          argjacent-cohort --version
          argjacent cohort --version
          argjacent-selftest
      - name: Unit tests
        run: pytest -q tests
      - name: HPC local smoke test
        run: bash hpc/test_hpc_local.sh
